openapi: 3.1.0
info:
  title: todo.sh API
  version: "1.0.0"
  description: API da To-Do List com UI de terminal. Erros em formato estavel `{ "error": { "code", "message" } }`.
servers:
  - url: http://127.0.0.1:3000
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: todo_sid
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: BAD_REQUEST }
            message: { type: string }
            details: { type: object, additionalProperties: true }
    Todo:
      type: object
      required: [id, title, priority, done, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 120 }
        description: { type: [string, "null"], maxLength: 1000 }
        priority: { type: string, enum: [low, normal, high] }
        done: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        createdAt: { type: string, format: date-time }
security:
  - sessionCookie: []
paths:
  /api/v1/health:
    get:
      summary: Liveness publica e minima (sem versao, sem dados)
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { status: { type: string, example: ok } } } } } }
  /api/v1/session:
    get:
      summary: Estado da sessao e token CSRF
      security: []
      responses:
        "200":
          description: Sessao atual (ou `authenticated: false`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated: { type: boolean }
                  user: { $ref: "#/components/schemas/User" }
                  csrfToken: { type: string }
  /api/v1/auth/register:
    post:
      summary: Cria conta (sessao iniciada)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string, maxLength: 254 }
                password: { type: string, minLength: 12, maxLength: 200 }
      responses:
        "201": { description: Criado, content: { application/json: { schema: { type: object, properties: { user: { $ref: "#/components/schemas/User" } } } } } }
        "400": { description: Entrada invalida, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: E-mail ja existe, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: Rate limit, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/auth/login:
    post:
      summary: Autentica (rotaciona o ID da sessao)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string, maxLength: 254 }
                password: { type: string, maxLength: 200 }
      responses:
        "200": { description: Autenticado, content: { application/json: { schema: { type: object, properties: { user: { $ref: "#/components/schemas/User" } } } } } }
        "401": { description: Credenciais invalidas (mensagem uniforme), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: Rate limit, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/auth/logout:
    post:
      summary: Invalida a sessao
      security: [{ sessionCookie: [] }, { csrfToken: [] }]
      responses:
        "204": { description: Sessao encerrada }
        "403": { description: CSRF invalido, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/todos:
    get:
      summary: Lista tarefas do usuario autenticado
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [all, open, done], default: open } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }
      responses:
        "200":
          description: Pagina de tarefas
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Todo" } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        "401": { description: Nao autenticado, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    post:
      summary: Cria tarefa (idempotente via Idempotency-Key)
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,64}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
                description: { type: string, maxLength: 1000 }
                priority: { type: string, enum: [low, normal, high], default: normal }
      responses:
        "201": { description: Criado, content: { application/json: { schema: { type: object, properties: { todo: { $ref: "#/components/schemas/Todo" } } } } } }
        "401": { description: Nao autenticado, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: CSRF invalido, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "413": { description: Payload grande demais, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: Rate limit, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/todos/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Atualiza tarefa do proprio usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
                description: { type: [string, "null"], maxLength: 1000 }
                priority: { type: string, enum: [low, normal, high] }
                done: { type: boolean }
      responses:
        "200": { description: Atualizada, content: { application/json: { schema: { type: object, properties: { todo: { $ref: "#/components/schemas/Todo" } } } } } }
        "404": { description: Nao existe ou nao pertence ao usuario, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: CSRF invalido, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      summary: Remove tarefa do proprio usuario
      responses:
        "204": { description: Removida }
        "403": { description: CSRF invalido, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Nao existe ou nao pertence ao usuario, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }